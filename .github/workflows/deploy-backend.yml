name: Deploy to AWS EC2

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS EC2 via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY: ${{ secrets.EC2_SSH_KEY }}
          APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          if [ -z "$EC2_HOST" ]; then
            echo "::error::EC2_HOST secret is not configured in repository secrets!"
            exit 1
          fi
          if [ -z "$EC2_KEY" ]; then
            echo "::error::EC2_SSH_KEY secret is not configured in repository secrets!"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          python3 - << 'PYEOF'
          import os, base64, subprocess

          raw = os.environ.get("EC2_KEY", "").strip()
          print(f"Key loaded: {len(raw)} chars, {len(raw.splitlines())} lines")

          # 1. Check if base64 encoded
          try:
              decoded = base64.b64decode(raw).decode('utf-8', errors='ignore')
              if "PRIVATE KEY" in decoded:
                  raw = decoded.strip()
                  print("✅ Decoded base64-wrapped private key")
          except Exception:
              pass

          # 2. Check if literal \n was pasted
          if "\\n" in raw and "\n" not in raw:
              raw = raw.replace("\\n", "\n")
              print("✅ Replaced literal \\n escape characters")

          # 3. Strip Windows CRLF
          raw = raw.replace("\r", "").strip()

          # 4. Check PEM headers
          if "BEGIN" not in raw:
              raw = f"-----BEGIN RSA PRIVATE KEY-----\n{raw}\n-----END RSA PRIVATE KEY-----"
              print("ℹ️ Added missing PEM header and footer")

          if not raw.endswith("\n"):
              raw += "\n"

          key_path = os.path.expanduser("~/.ssh/deploy_key")
          with open(key_path, "w", newline="\n") as f:
              f.write(raw)
          os.chmod(key_path, 0o600)

          res = subprocess.run(["ssh-keygen", "-l", "-f", key_path], capture_output=True, text=True)
          if res.returncode == 0:
              print(f"✅ Valid Key Fingerprint: {res.stdout.strip()}")
          else:
              print(f"❌ Key validation error: {res.stderr.strip()}")
              print(f"First 25 chars: {repr(raw[:25])}")
              print(f"Last 25 chars: {repr(raw[-25:])}")
          PYEOF

          TARGET_USER="${EC2_USER:-ubuntu}"
          TARGET_DIR="${APP_DIR:-$HOME/IQ_trial}"

          echo "🚀 Connecting to $TARGET_USER@$EC2_HOST..."
          ssh -v -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o PubkeyAcceptedKeyTypes=+ssh-rsa \
            -o PubkeyAcceptedAlgorithms=+ssh-rsa \
            -o ConnectTimeout=30 \
            "$TARGET_USER@$EC2_HOST" "bash -s" << EOF
            APP_DIR="$TARGET_DIR"
            echo "🚀 Deploying in directory: \$APP_DIR"
            cd "\$APP_DIR" || cd "\$HOME"/IQ_trial || cd "\$HOME"/*IQ* || exit 1

            echo "📥 Pulling latest changes from main..."
            git checkout -- .
            git pull origin main

            if command -v pm2 >/dev/null 2>&1; then
              echo "🔄 Restarting backend services via PM2..."
              pm2 restart all || {
                (cd backend && pm2 start dist/src/main.js --name "main-api")
                (cd exam/backend && pm2 start dist/main.js --name "exam-api")
              }
              pm2 save
              echo "🩺 Verifying service health..."
              sleep 3
              curl -sf http://localhost:3000/api/health && echo " -> main-api healthy" || echo " -> main-api starting..."
              curl -sf http://localhost:3001/api/exam/health && echo " -> exam-api healthy" || echo " -> exam-api starting..."
            fi

            if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
              echo "🔨 Docker daemon detected: updating docker containers..."
              docker compose build backend frontend || true
              docker compose up -d backend frontend || true
              docker image prune -f || true
            fi

            echo "✅ Deployment completed successfully!"
          EOF
